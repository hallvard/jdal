# Builds the self-contained jar and attaches it to a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The jbang catalog (jbang-catalog.json) points at releases/latest/download/jdal.jar.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - name: Build
        run: ./mvnw -B -q package -DskipTests
      - name: Smoke test
        run: |
          cp jdal-cli/target/jdal-cli-*-all.jar jdal.jar
          java -jar jdal.jar drivers
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jdal.jar --title "$GITHUB_REF_NAME" --generate-notes
